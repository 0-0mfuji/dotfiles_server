# dev コマンドのtarget定義
# 列: target  host          path            instance      repo(省略可, "-"で無指定)   vcs(省略可, git|jj)   deps(省略可)   preview(省略可)   workflow(省略可)
#
# - target : `dev <target>` の名前。1つのコンテナに複数のプロジェクトを置くときは、"グループ/プロジェクト" と書く。
#              os/sota, os/boot  ->  dev os sota / dev os boot  (dev os だけなら、番号で選ぶ)
#            プロジェクトを分けない target (lang など) は、今までどおり dev lang で開く。
# - host   : ~/.ssh/config.local で定義したSSH論理名
# - path   : リモート側のプロジェクトパス (Zedへ渡す)
# - instance: Development Server上のIncus instance名。指定すると `dev` が
#             接続前に `incus start <instance>` を実行する。管理は別リポジトリ。
#
# - repo   : GitHubのクローンURL。pathが無ければ `dev` が自動でcloneする。
#            privateはMacのSSHエージェントを転送して認証する (秘密鍵はコンテナに置かない)。
# - vcs    : `jj` を指定すると、clone後に `jj git init --colocate` を実行して、gitと並べてjjを使えるようにする
#            (既にあれば何もしない)。省略または `git` なら、gitのまま。.git は残るので、git/Zed/Claude/Codexも、そのまま動く。
# - deps   : 依存するIncus instance (カンマ区切り、"-"で無し)。`dev` が本体より先に起動する (止めはしない)。
#            例) video は voice-dev の VOICEVOX を呼ぶ。コンテナ同士は互いを知らず、呼び出し先はURLの環境変数で渡す。
# - preview: 開発サーバーの指定 ("-"で無し)。`dev` が、未起動ならコンテナ内で起動し、SSHトンネルでMacのブラウザに開く。
#            `PORT` は Remotion Studio、`PORT=SCRIPT` は package.json のスクリプト (例 5173=dev:web。`--host 127.0.0.1 --port PORT` を渡す)。
#            `PORT=flutter` は Flutter Web (`flutter run -d web-server`)。
#            `PORT=zola` は Zola (`zola serve`)。config.toml または zola.toml と Zola が必要。
#            複数はカンマ区切り (例 `5173=dev:web,6006=storybook`)。それぞれ起動してブラウザに開く。
#            npm系には package.json と node_modules、Flutterには pubspec.yaml と web/ が必要。`dev --preview video` でプレビューだけ開ける。
#
# - workflow: 既定 development。secretary は秘書用の初期設定案内とNanoMuseを開く（SilverBulletは任意） (Zed・開発用ログインなし)。
#
# 値は利用環境に合わせて自由に変更・追加してよい。

