# dev コマンドのtarget定義
# 列: target  host          path            instance      repo(省略可, "-"で無指定)   vcs(省略可, git|jj)
#
# - target : `dev <target>` の名前。1つのコンテナに複数のプロジェクトを置くときは、"グループ/プロジェクト" と書く。
#              os/sota, os/boot  ->  dev os sota / dev os boot  (dev os だけなら、番号で選ぶ)
#            プロジェクトを分けない target (lang など) は、今までどおり dev lang で開く。
# - host   : ~/.ssh/config.local で定義したSSH論理名
# - path   : リモート側のプロジェクトパス (Zedへ渡す)
# - instance: Development Server上のIncus instance名。指定すると `dev` が
#             接続前に `incus start <instance>` を実行する。管理は別リポジトリ。
#
# - repo   : GitHubのクローンURL。pathが無ければ `dev` が自動でcloneする。
#            privateはMacのSSHエージェントを転送して認証する (秘密鍵はコンテナに置かない)。
# - vcs    : `jj` を指定すると、clone後に `jj git init --colocate` を実行して、gitと並べてjjを使えるようにする
#            (既にあれば何もしない)。省略または `git` なら、gitのまま。.git は残るので、git/Zed/Claude/Codexも、そのまま動く。
#
# 値は利用環境に合わせて自由に変更・追加してよい。

lang      lang-dev      ~/src/manul-lang lang-dev   git@github.com:0-0mfuji/manul-lang.git   jj
cpu       cpu-dev       ~/src/cpu        cpu-dev   -
os/sota   os-dev        ~/src/sota       os-dev   git@github.com:0-0mfuji/sota.git   jj
fpga      fpga-dev      ~/src/fpga       fpga-dev   -
robot     robot-dev     ~/src/robot      robot-dev   -
flutter   flutter-dev   ~/src/flutter    flutter-dev   -
video     video-linux   ~/src/video      video-dev   -
